[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "work4ce-assistant"
version = "0.1.0"
description = "Capability-driven security investigation foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.4", "httpx==0.28.1",
  "jsonschema==4.26.0", "mcp==1.29.0", "uvicorn==0.52.1",
  "SQLAlchemy==2.0.55", "alembic==1.20.1", "psycopg[binary]==3.3.6",
  "PyJWT[crypto]==2.13.0",
]

[project.optional-dependencies]
dev = ["packaging==26.3", "playwright==1.62.0"]

[project.scripts]
work4ce = "work4ce_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
work4ce_assistant = ["web_assets/*", "web_assets/**/*"]
